name: Draft release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character reviewed source commit
        required: true
        type: string
      tag:
        description: Reviewed release tag (vX.Y.Z)
        required: true
        type: string
      evidence:
        description: Sanitized acceptance record path under docs/releases/
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: draft-release
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate release request
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EVIDENCE_PATH: ${{ inputs.evidence }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid tag" }
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw "Invalid source commit" }
          git merge-base --is-ancestor $env:SOURCE_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source must belong to integrated history" }
          if ($env:EVIDENCE_PATH -notmatch '^docs/releases/[A-Za-z0-9._-]+\.md$') { throw "Invalid evidence path" }
          if (!(Test-Path -LiteralPath $env:EVIDENCE_PATH)) { throw "Missing acceptance evidence" }
          $evidence = Get-Content -LiteralPath $env:EVIDENCE_PATH -Raw
          if (!$evidence.Contains("Acceptance: PASS") -or !$evidence.Contains("Commit: $env:SOURCE_COMMIT")) { throw "Evidence must approve the source commit" }
          Copy-Item -LiteralPath $env:EVIDENCE_PATH "$env:RUNNER_TEMP/acceptance.md"
          git checkout --detach $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Source checkout failed" }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag must match product version" }
      - name: Build reviewed commit
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust setup failed" }
          python tools/repository/prepare_python_tests.py
          if ($LASTEXITCODE -ne 0) { throw "Python dependency preparation failed" }
          ./build.ps1 -Python (Get-Command python).Source
      - name: Create draft and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EVIDENCE_PATH: ${{ inputs.evidence }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          git archive --format=zip --output=dist/source.zip $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
          Copy-Item LICENSE dist/LICENSE
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip','.exe' })
          if ($assets.Count -lt 2) { throw "Missing distribution assets" }
          $lines = @($assets | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name })
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          $paths = @($assets.FullName) + @("dist/LICENSE","dist/SHA256SUMS.txt")
          gh release create $env:RELEASE_TAG @paths --draft --target $env:SOURCE_COMMIT --title "BIMBRIDGE $env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/acceptance.md"
          if ($LASTEXITCODE -ne 0) { throw "Draft release failed" }
