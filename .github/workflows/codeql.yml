name: Optional CodeQL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    if: vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410
        with:
          languages: csharp,python
      - run: dotnet build tests/PDI.RevitMcp.Tests/PDI.RevitMcp.Tests.csproj -c Release
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9
