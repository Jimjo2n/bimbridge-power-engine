name: Worker tests
on:
  # Only when the workers or their preparation change (these suites test nothing else). The Windows build always runs them too.
  push:
    branches: [main]
    paths: ['workers/python/**', 'native/**', 'tools/repository/prepare_python_tests.py', '.github/workflows/workers.yml']
  pull_request:
    paths: ['workers/python/**', 'native/**', 'tools/repository/prepare_python_tests.py', '.github/workflows/workers.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/repository/prepare_python_tests.py
      - run: python -B -m unittest discover -s workers/python/tests -v
  rust-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup default stable
      - run: cargo test --locked --release --manifest-path native/power_engine/Cargo.toml
