name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/repository/check_repository.py
      - run: python tools/repository/inspect_history.py
      - name: First-party Python syntax
        run: python -m compileall -q workers/python tools/repository
      - name: Delivery archive security checks
        run: python -m unittest discover -s tests/repository -v
      - name: Declared dependency inventory
        run: |
          mkdir -p artifacts
          python tools/repository/dependency_inventory.py > artifacts/dependency-inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: declared-dependency-inventory
          path: artifacts/dependency-inventory.json
          retention-days: 7
