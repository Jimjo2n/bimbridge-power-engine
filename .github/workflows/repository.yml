name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python tools/repository/check_repository.py
      - run: python tools/repository/inspect_history.py
      - name: First-party Python syntax
        run: python -m compileall -q workers/python tools/repository
      - name: Delivery archive security checks
        run: python -m unittest discover -s tests/repository -v
      - name: Declared dependency inventory
        run: |
          mkdir -p artifacts
          python tools/repository/dependency_inventory.py > artifacts/dependency-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: declared-dependency-inventory
          path: artifacts/dependency-inventory.json
          retention-days: 7
