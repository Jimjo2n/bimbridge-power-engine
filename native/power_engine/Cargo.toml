[package]
name = "bimbridge_power_engine"
version = "0.9.0"
edition = "2021"
description = "BIMBRIDGE Power Engine: Rust Geometry Engine (FFI cdylib + IPC worker). Sin acceso a Revit."
license = "GPL-3.0-only"
publish = false

[lib]
name = "bimbridge_power_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bimbridge-power-engine"
path = "src/worker.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
